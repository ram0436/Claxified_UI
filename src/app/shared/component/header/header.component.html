<header class="main-header">
  <nav class="header-nav">
    <div class="header-container">
      <!-- Left Section: Logo & Menu Icon -->
      <div class="header-left">
        <!-- Menu Icon (Hamburger) -->
        <button
          class="menu-toggle"
          (click)="toggleSlideVisibility()"
          aria-label="Toggle menu"
        >
          <span class="material-icons-outlined">menu</span>
        </button>

        <!-- Logo -->
        <a [routerLink]="['/']" class="header-logo" (click)="getAllItems()">
          <img
            src="https://cfdblob.blob.core.windows.net/image/Claxified128730.png"
            alt="Claxified"
            class="logo-img"
          />
        </a>
      </div>

      <!-- Center Section: Navigation Links -->
      <ul class="header-nav-links">
        <li>
          <a routerLink="/" class="nav-link" [class.active]="isActiveRoute('/')"
            >Marketplace</a
          >
        </li>
        <li>
          <a
            routerLink="/classified-ads"
            class="nav-link"
            [class.active]="isActiveRoute('/classified-ads')"
            >Claxified Ads</a
          >
        </li>
        <li>
          <a
            routerLink="/business"
            class="nav-link"
            [class.active]="isActiveRoute('/business')"
            >Business</a
          >
        </li>
        <li>
          <a
            routerLink="/news"
            class="nav-link"
            [class.active]="isActiveRoute('/news')"
            >News</a
          >
        </li>
      </ul>

      <!-- Right Section: My Claxified unified dropdown -->
      <div class="header-right">
        <ng-container *ngIf="!isUserLogedIn">
          <button class="auth-btn" (click)="openLoginModal()">
            <span class="material-icons-outlined">person_outline</span>
            <span class="auth-text">Login / Register</span>
          </button>
        </ng-container>

        <ng-container *ngIf="isUserLogedIn">
          <button
            class="my-claxified-trigger"
            [matMenuTriggerFor]="myClaxifiedMenu"
            #myClaxifiedTrigger="matMenuTrigger"
            (click)="toggleMyClaxified()"
          >
            <div class="mct-avatar">
              <img
                *ngIf="imageUrl && imageUrl !== defaultAvatar"
                [src]="imageUrl"
                alt="Profile"
                (error)="onImageError($event)"
              />
              <span *ngIf="!imageUrl || imageUrl === defaultAvatar">{{
                getUserInitials()
              }}</span>
            </div>
            <span class="mct-label">My Claxified</span>
            <span
              class="material-icons-outlined expand"
              [class.rotated]="myClaxifiedOpen"
            >
              expand_more
            </span>
          </button>
        </ng-container>

        <!-- Action buttons unchanged -->
        <div class="header-actions">
          <button
            class="action-btn business-btn"
            *ngIf="!isActiveRoute('/classified-ads')"
            (click)="openBusinessLoginModal()"
            aria-label="List Business"
          >
            <img
              [src]="getBusinessButtonImage()"
              alt="List Business"
              class="action-btn-img"
            />
          </button>

          <button
            class="action-btn post-ad-btn"
            *ngIf="!isActiveRoute('/business')"
            (click)="postAdd()"
            aria-label="Post Free Ad"
          >
            <img
              src="https://cfdblob.blob.core.windows.net/image/Claxified922983.png"
              alt="Post Free Ad"
              class="action-btn-img"
            />
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ========================================================= -->
  <!--  UNIFIED "MY CLAXIFIED" DROPDOWN                          -->
  <!-- ========================================================= -->
  <mat-menu
    #myClaxifiedMenu="matMenu"
    xPosition="before"
    yPosition="below"
    overlapTrigger="false"
    class="my-claxified-panel"
  >
    <div class="menu-header">
      <div class="menu-avatar-wrap">
        <img
          *ngIf="imageUrl && imageUrl !== defaultAvatar"
          [src]="imageUrl"
          alt="Profile"
          class="menu-avatar"
          (error)="onImageError($event)"
        />
        <span
          *ngIf="!imageUrl || imageUrl === defaultAvatar"
          class="menu-avatar-initials"
        >
          {{ getUserInitials() }}
        </span>
      </div>
      <div class="menu-user-info">
        <p class="menu-user-name">{{ userData?.firstName || "User" }}</p>
        <span class="menu-user-role">{{
          isAdmin ? "Admin" : "Business Owner"
        }}</span>
      </div>
    </div>

    <hr class="menu-divider" />

    <button
      mat-menu-item
      class="menu-item"
      routerLink="/my-claxified/dashboard"
    >
      <span class="material-icons-outlined">home</span>
      <span>Dashboard</span>
    </button>

    <button
      mat-menu-item
      class="menu-item"
      routerLink="/my-claxified/my-listings"
    >
      <span class="material-icons-outlined">description</span>
      <span>My Listings</span>
    </button>

    <button
      mat-menu-item
      class="menu-item"
      routerLink="/my-claxified/my-businesses"
    >
      <span class="material-icons-outlined">storefront</span>
      <span>My Businesses</span>
    </button>

    <button
      mat-menu-item
      class="menu-item"
      routerLink="/my-claxified/enquiries"
    >
      <span class="material-icons-outlined">chat_bubble_outline</span>
      <span>Enquiries & Leads</span>
    </button>

    <button
      mat-menu-item
      class="menu-item"
      routerLink="/my-claxified/analytics"
    >
      <span class="material-icons-outlined">bar_chart</span>
      <span>Analytics</span>
    </button>

    <hr class="menu-divider" />

    <button mat-menu-item class="menu-item" routerLink="/my-claxified/billing">
      <span class="material-icons-outlined">credit_card</span>
      <span>Packages &amp; Billing</span>
    </button>

    <button mat-menu-item class="menu-item" routerLink="/my-claxified/settings">
      <span class="material-icons-outlined">settings</span>
      <span>Settings</span>
    </button>

    <hr class="menu-divider" />

    <button mat-menu-item class="menu-item menu-logout" (click)="logout()">
      <span class="material-icons-outlined">logout</span>
      <span>Logout</span>
    </button>
  </mat-menu>
</header>
