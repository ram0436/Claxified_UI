<div class="claxified-shell">
  <!-- Slim inner topbar (sits under the global fixed header) -->
  <div class="inner-topbar">
    <button
      class="hamburger"
      (click)="toggleSidebar()"
      aria-label="Toggle menu"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="inner-title">My Claxified</div>

    <div class="topbar-right">
      <button class="icon-btn" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path
            d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M13.73 21a2 2 0 01-3.46 0"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="notif-dot"></span>
      </button>

      <div class="user-chip">
        <span class="avatar">{{ userInitials }}</span>
        <span class="user-meta">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole || "Account" }}</span>
        </span>
      </div>
    </div>
  </div>

  <div class="body">
    <!-- Sidebar -->
    <aside class="sidebar" [class.open]="isSidebarOpen">
      <div class="sidebar-title">My Claxified</div>

      <nav class="nav-list">
        <a
          *ngFor="let item of adminNavItems"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeSidebar()"
          class="nav-item"
          [style.display]="isAdmin ? 'flex' : 'none'"
        >
          <span class="nav-icon" [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'admin'" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2l7 4v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-4z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg *ngSwitchCase="'attributes'" viewBox="0 0 24 24" fill="none">
              <path
                d="M4 6h16M4 12h16M4 18h7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle
                cx="19"
                cy="18"
                r="2"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </span>
          <span>{{ item.label }}</span>
        </a>

        <div class="nav-divider" *ngIf="isAdmin"></div>

        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeSidebar()"
          class="nav-item"
        >
          <span class="nav-icon" [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'home'" viewBox="0 0 24 24" fill="none">
              <path
                d="M3 11l9-8 9 8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M5 10v10h14V10"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg *ngSwitchCase="'listings'" viewBox="0 0 24 24" fill="none">
              <rect
                x="4"
                y="3"
                width="16"
                height="18"
                rx="2"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="8"
                y1="8"
                x2="16"
                y2="8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <line
                x1="8"
                y1="12"
                x2="16"
                y2="12"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <line
                x1="8"
                y1="16"
                x2="12"
                y2="16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <svg *ngSwitchCase="'business'" viewBox="0 0 24 24" fill="none">
              <path
                d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg *ngSwitchCase="'chat'" viewBox="0 0 24 24" fill="none">
              <path
                d="M21 11.5a8.5 8.5 0 01-8.5 8.5H4l2-4.5A8.5 8.5 0 1121 11.5z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24" fill="none">
              <line
                x1="4"
                y1="20"
                x2="4"
                y2="10"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <line
                x1="12"
                y1="20"
                x2="12"
                y2="4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <line
                x1="20"
                y1="20"
                x2="20"
                y2="14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <svg *ngSwitchCase="'card'" viewBox="0 0 24 24" fill="none">
              <rect
                x="2"
                y="5"
                width="20"
                height="14"
                rx="2"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="2"
                y1="10"
                x2="22"
                y2="10"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
            <svg *ngSwitchCase="'settings'" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="3"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span>{{ item.label }}</span>
        </a>
      </nav>

      <div class="nav-divider" *ngIf="isAdmin"></div>

      <a class="nav-item logout" (click)="logout()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <polyline
              points="16 17 21 12 16 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <line
              x1="21"
              y1="12"
              x2="9"
              y2="12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span>Logout</span>
      </a>

      <div class="promo-card">
        <p class="promo-title">
          Grow Your Presence with <span>Claxified</span>
        </p>
        <p class="promo-sub">List. Connect. Succeed.</p>
        <a routerLink="/post-menu" class="promo-btn">Post a New Listing</a>
      </div>
    </aside>

    <div
      class="sidebar-backdrop"
      *ngIf="isSidebarOpen"
      (click)="closeSidebar()"
    ></div>

    <!-- Page content -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
