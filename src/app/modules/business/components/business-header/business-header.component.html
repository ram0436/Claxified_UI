<header class="business-header">
  <nav class="business-nav-container">
    <a routerLink="/business" class="business-logo">
      <img
        src="https://cfdblob.blob.core.windows.net/logo/Claxified_Business.png"
        alt="Logo"
        class="business-header-logo"
      />
    </a>

    <ul class="business-nav-links">
      <li><a routerLink="/">Marketplace</a></li>
      <li *ngIf="!isUserLogedIn">
        <a (click)="openLoginModal()">Login</a>
      </li>

      <li class="business-dropdown" *ngIf="isUserLogedIn">
        <button
          class="business-profile-btn"
          mat-button
          [matMenuTriggerFor]="businessMenu"
          (click)="toggleExpandIcon()"
        >
          <span class="business-profile-btn-label">My Businesses</span>
          <mat-icon class="expand" [class.rotated]="expandIconVisible"
            >expand_more</mat-icon
          >
        </button>
      </li>
      <li>
        <a (click)="openBusinessLoginModal()" class="business-cta-btn">
          <img
            src="https://cfdblob.blob.core.windows.net/claxified-business/business-logo/Claxified446474.png"
            alt="Register Business"
            class="business-cta-img"
          />
        </a>
      </li>
    </ul>
  </nav>

  <mat-menu
    #businessMenu="matMenu"
    xPosition="before"
    class="business-menu-panel"
  >
    <button
      mat-menu-item
      class="business-menu-header business-list-item"
      *ngFor="
        let biz of showAllBusinesses ? businesses : (businesses | slice : 0 : 3)
      "
      (click)="switchBusiness(biz)"
    >
      <div
        class="business-avatar-lg"
        [style.background]="
          biz.logoUrl ? null : avatarGradient(biz.businessName)
        "
      >
        <img *ngIf="biz.logoUrl" [src]="biz.logoUrl" alt="" />
        <span *ngIf="!biz.logoUrl" class="avatar-initials-menu">{{
          getInitials(biz.businessName)
        }}</span>
      </div>
      <div class="mt-10">
        <p class="mt-0 pl-10">{{ biz.businessName }}</p>
      </div>
    </button>

    <button
      mat-menu-item
      class="button-item show-more-item"
      *ngIf="businesses.length > 3"
      (click)="toggleShowAllBusinesses($event)"
    >
      <span class="material-icons-outlined">{{
        showAllBusinesses ? "expand_less" : "expand_more"
      }}</span>
      <span class="btn-txt">{{
        showAllBusinesses ? "Show less" : "Show more"
      }}</span>
    </button>

    <div class="empty-business-list" *ngIf="businesses.length === 0">
      <p class="mt-0">No businesses yet</p>
    </div>

    <hr class="profile-hr" />

    <button mat-menu-item class="button-item" (click)="goToOwnerProfile()">
      <span class="material-icons-outlined">person_outline</span>
      <span class="btn-txt">Profile</span>
    </button>
    <button mat-menu-item class="button-item" (click)="goToMyBusiness()">
      <span class="material-icons-outlined">business_center</span>
      <span class="btn-txt">All Businesses</span>
    </button>
    <button mat-menu-item class="button-item" (click)="goToAccountSettings()">
      <span class="material-icons">settings</span>
      <span class="btn-txt">Account Setting</span>
    </button>

    <hr class="profile-hr" />

    <button mat-menu-item class="button-item" (click)="logout()">
      <span class="material-icons">logout</span>
      <span class="btn-txt">Logout</span>
    </button>
  </mat-menu>
</header>
