<div class="review-overlay" (click)="close.emit()">
  <div class="review-panel" (click)="$event.stopPropagation()">
    <button class="review-close" (click)="close.emit()">
      <span class="material-icons-outlined">close</span>
    </button>

    <h2 class="review-title">{{ review ? "Edit" : "Write a" }} Review</h2>
    <p class="review-subtitle" *ngIf="!review">
      Share your experience with this business
    </p>

    <form (ngSubmit)="saveReview()" #reviewForm="ngForm">
      <!-- Star Rating -->
      <div class="review-form-group">
        <label class="review-label">Rating *</label>
        <div class="review-stars" (mouseleave)="hoverRating = 0">
          <button
            type="button"
            class="review-star-box"
            *ngFor="let s of [1, 2, 3, 4, 5]"
            [class.filled]="s <= (hoverRating || formData.rating)"
            [class.selected]="s === formData.rating"
            [style.animation-delay.ms]="(s - 1) * 45"
            [attr.aria-label]="s + (s === 1 ? ' star' : ' stars')"
            (click)="setRating(s)"
            (mouseenter)="hoverRating = s"
          >
            <span class="material-icons-outlined review-star">star</span>
          </button>
        </div>
        <div
          class="review-rating-label"
          [class.has-rating]="formData.rating > 0"
        >
          {{
            getRatingLabel(hoverRating || formData.rating) ||
              "Tap a star to rate"
          }}
        </div>
      </div>

      <!-- Title -->
      <!-- <div class="review-form-group">
        <label class="review-label">Title</label>
        <input
          type="text"
          class="review-input"
          [(ngModel)]="formData.title"
          name="title"
          placeholder="Summarize your experience"
        />
      </div> -->

      <!-- Comment -->
      <div class="review-form-group">
        <label class="review-label">Comment *</label>
        <textarea
          class="review-textarea"
          [(ngModel)]="formData.comment"
          name="comment"
          rows="4"
          required
          placeholder="Share your experience with this business"
        ></textarea>
      </div>

      <!-- Actions -->
      <div class="review-actions">
        <button
          type="button"
          class="review-btn review-btn-outline"
          (click)="close.emit()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="review-btn review-btn-primary"
          [disabled]="saving || formData.rating === 0"
        >
          {{
            saving
              ? "Submitting..."
              : review
                ? "Update Review"
                : "Submit Review"
          }}
        </button>
      </div>
    </form>
  </div>
</div>
