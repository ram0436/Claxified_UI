<div class="cp-page">
  <!-- ============ PAGE HEADER ============ -->
  <section class="cp-header">
    <div class="cp-header-top">
      <div class="cp-header-info">
        <nav class="cp-breadcrumb" aria-label="Breadcrumb">
          <a routerLink="/classified-ads">Home</a>
          <span class="material-icons-outlined cp-crumb-sep"
            >chevron_right</span
          >
          <span class="cp-crumb-current">{{ category }}</span>
        </nav>

        <div class="cp-title-row">
          <span class="cp-title-icon">
            <span class="material-icons-outlined">{{
              getActiveCategoryIcon()
            }}</span>
          </span>
          <div>
            <h1 class="cp-title">{{ category }}</h1>
            <p class="cp-subtitle" *ngIf="!isLoading">
              {{ cards.length }}
              {{ cards.length === 1 ? "listing" : "listings" }} available
            </p>
            <p class="cp-subtitle" *ngIf="isLoading">Loading listings…</p>
          </div>
        </div>
      </div>

      <button class="cp-filter-toggle" (click)="toggleFilters()">
        <span class="material-icons-outlined">tune</span>
        Filters
      </button>
    </div>

    <!-- Browse / switch categories -->
    <div class="category-switcher-wrapper" *ngIf="browseCategories.length > 0">
      <div class="category-switcher-row-wrapper">
        <button
          class="cs-scroll-arrow cs-scroll-arrow-left"
          (click)="
            categorySwitcherScroll.scrollBy({ left: -220, behavior: 'smooth' })
          "
          aria-label="Scroll categories left"
        >
          <span class="material-icons-outlined">chevron_left</span>
        </button>

        <div class="category-switcher-row" #categorySwitcherScroll>
          <div
            class="category-switcher-chip"
            *ngFor="let cat of browseCategories"
            [class.active]="isActiveCategory(cat)"
            (click)="navigateToCategory(cat)"
          >
            <span class="material-icons-outlined">{{
              getCategoryIcon(cat.categoryName)
            }}</span>
            <span>{{ cat.categoryName }}</span>
          </div>
        </div>

        <button
          class="cs-scroll-arrow cs-scroll-arrow-right"
          (click)="
            categorySwitcherScroll.scrollBy({ left: 220, behavior: 'smooth' })
          "
          aria-label="Scroll categories right"
        >
          <span class="material-icons-outlined">chevron_right</span>
        </button>
      </div>
    </div>

    <!-- Refine within active category: sub-categories -->
    <div
      class="subcategory-switcher-row"
      *ngIf="activeCategorySubCategories.length > 0"
    >
      <span class="subcategory-connector"></span>

      <div
        class="subcategory-chip"
        [class.active]="!currentSubParam"
        (click)="clearSubCategory()"
      >
        <span class="material-icons-outlined">apps</span>
        All {{ category }}
      </div>

      <div
        class="subcategory-chip"
        *ngFor="let sub of activeCategorySubCategories"
        [class.active]="isActiveSubCategory(sub)"
        (click)="navigateToSubCategory(sub)"
      >
        {{ sub.subCategoryName }}
      </div>
    </div>
  </section>

  <!-- ============ BODY ============ -->
  <div class="cp-body">
    <!-- Mobile backdrop, closes the drawer on tap -->
    <div
      class="cp-backdrop"
      *ngIf="showFilters"
      (click)="toggleFilters()"
    ></div>

    <aside class="cp-sidebar" [class.open]="showFilters">
      <app-commercial-service-filter
        class="fixed-filter"
        (resetClicked)="onResetClicked()"
      ></app-commercial-service-filter>
    </aside>

    <main class="cp-main">
      <div class="spinner__loading" *ngIf="isLoading">
        <div>
          <mat-spinner></mat-spinner>
        </div>
      </div>

      <app-post-card
        *ngIf="!isLoading"
        [cards]="cards"
        [isLoading]="isLoading"
        [increaseHeight]="true"
        [increaseMargin]="true"
        class="app-post-card"
        [columns]="4"
      ></app-post-card>
    </main>
  </div>
</div>
