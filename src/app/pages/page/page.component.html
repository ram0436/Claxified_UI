<div class="page-container" *ngIf="pageData; else notFound">
  <!-- ================= TITLE ================= -->
  <h1 class="page-title">
    {{ pageData.title }}
  </h1>

  <!-- ================= PARAGRAPHS ================= -->
  <div class="page-paragraphs">
    <p *ngFor="let para of pageData.paragraphs">
      {{ para }}
    </p>
  </div>

  <!-- ================= SECTIONS ================= -->
  <div class="page-sections">
    <div
      class="section-card"
      *ngFor="let section of pageData.sections"
      [ngClass]="section.type"
    >
      <!-- Section Heading -->
      <h3>
        {{ section.heading }}
      </h3>

      <!-- Section Text -->
      <p *ngIf="section.text">
        {{ section.text }}
      </p>

      <!-- ================= BULLET LIST (IMPORTANT) ================= -->
      <ul *ngIf="section.list?.length" class="section-list">
        <li *ngFor="let item of section.list">
          {{ item }}
        </li>
      </ul>

      <p *ngIf="section.footer">
        {{ section.footer }}
      </p>
    </div>
  </div>
</div>

<!-- ================= 404 PAGE ================= -->
<ng-template #notFound>
  <div class="not-found">
    <h1>404</h1>
    <p>Page not found</p>
  </div>
</ng-template>
