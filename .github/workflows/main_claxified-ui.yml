# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Angular app to Azure Web App - claxified-ui

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Find Angular build output
        run: |
          echo "Searching for Angular index.html..."

          INDEX_FILE=$(find dist -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: Angular index.html was not found."
            echo "Contents of dist:"
            find dist -maxdepth 5 -type f | head -100
            exit 1
          fi

          APP_DIR=$(dirname "$INDEX_FILE")

          echo "Angular index.html found at:"
          echo "$INDEX_FILE"

          echo "Angular deployment directory:"
          echo "$APP_DIR"

          mkdir -p deploy
          cp -R "$APP_DIR"/. deploy/

          echo "Deployment files:"
          find deploy -maxdepth 2 -type f | head -100

      - name: Upload Angular build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: deploy
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Angular build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-app
          path: ./deploy

      - name: Show deployment files
        run: |
          echo "Files to deploy:"
          find ./deploy -maxdepth 2 -type f | head -100

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'claxified-ui'
          slot-name: 'Production'
          package: ./deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BEB24D89B889439884A510E7E55765C6 }}
